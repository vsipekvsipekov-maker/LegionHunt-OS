services:
  legionhunt:
    container_name: legionhunt-os

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - legion-network

  postgres:
    image: postgres:17
    container_name: legionhunt-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: legionhunt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legionhunt"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - legion-network

volumes:
  postgres-data:

networks:
  legion-network: